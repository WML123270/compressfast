# 极速压图 — Nginx 生产配置
# 位置: /etc/nginx/sites-available/png-compressor
# ICP备案已通过 ✅ — SSL 待获取

# HTTP (certbot 获取证书阶段)
server {
    listen 80;
    server_name jisuyatu.com www.jisuyatu.com;

    # 用于 certbot 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 配置（certbot 获取证书后自动生成，以下为手动备选）
server {
    listen 443 ssl http2;
    server_name jisuyatu.com www.jisuyatu.com;

    ssl_certificate /etc/letsencrypt/live/jisuyatu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jisuyatu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/jisuyatu.com/chain.pem;

    # HSTS (1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
