<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1270px;height:760px;font-family:'Segoe UI',system-ui,sans-serif;background:#0b1420;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:40px 40px}
.glow{position:absolute;top:-80px;right:-100px;width:500px;height:300px;background:radial-gradient(ellipse,rgba(139,92,246,.12),transparent)}
.content{position:relative;z-index:1;display:flex;gap:60px;align-items:center;padding:40px 80px}
.left{flex:1}
.badge{display:inline-block;padding:6px 18px;border-radius:20px;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.3);color:#a78bfa;font-size:14px;font-weight:600;margin-bottom:24px}
h1{font-size:48px;font-weight:800;line-height:1.2;margin-bottom:16px}
.desc{font-size:18px;color:#94a3b8;line-height:1.6;margin-bottom:28px}
.fmts{display:flex;gap:10px;flex-wrap:wrap}
.fmt{font-size:16px;font-weight:700;padding:8px 18px;border-radius:8px}
.fmt.in{background:rgba(255,255,255,.06);color:#e2e8f0}
.fmt.arrow{background:transparent;color:#64748b;padding:8px 4px}
.fmt.out{color:#fff}
.right{width:360px;display:flex;flex-direction:column;gap:12px}
.arrow-row{display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(255,255,255,.04);border-radius:10px;border-left:3px solid var(--c)}
.arrow-row .from{color:#94a3b8;font-size:15px}
.arrow-row .sep{color:var(--c);font-weight:700;font-size:18px;margin:0 6px}
.arrow-row .to{color:#fff;font-weight:700;font-size:15px}
.footer-text{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);z-index:1;font-size:20px;font-weight:700;color:#06b6d4}
</style></head>
<body>
<div class="bg-grid"></div><div class="glow"></div>
<div class="content">
  <div class="left">
    <div class="badge">🎨 FORMAT SUPPORT</div>
    <h1>7 Formats In.<br>5 Formats Out.</h1>
    <p class="desc">PNG, JPEG, WebP, AVIF, GIF, BMP, SVG, HEIC —<br>drag, pick output format, done. All local.</p>
    <div class="fmts">
      <span class="fmt in">PNG</span><span class="fmt arrow">→</span>
      <span class="fmt out" style="background:#3b82f6">WebP</span>
      <span class="fmt in">JPEG</span><span class="fmt arrow">→</span>
      <span class="fmt out" style="background:#10b981">AVIF</span>
      <span class="fmt in">SVG</span><span class="fmt arrow">→</span>
      <span class="fmt out" style="background:#f59e0b">PNG</span>
    </div>
  </div>
  <div class="right">
    <div class="arrow-row" style="--c:#3b82f6"><span class="from">PNG 5.2MB</span><span class="sep">→</span><span class="to">WebP 412KB</span></div>
    <div class="arrow-row" style="--c:#10b981"><span class="from">JPEG 3.1MB</span><span class="sep">→</span><span class="to">AVIF 188KB</span></div>
    <div class="arrow-row" style="--c:#8b5cf6"><span class="from">WebP</span><span class="sep">→</span><span class="to">JPG</span></div>
    <div class="arrow-row" style="--c:#f59e0b"><span class="from">SVG</span><span class="sep">→</span><span class="to">PNG 4K</span></div>
    <div class="arrow-row" style="--c:#ef4444"><span class="from">HEIC</span><span class="sep">→</span><span class="to">JPG</span></div>
  </div>
</div>
<div class="footer-text">compressfast.site</div>
</body></html>
