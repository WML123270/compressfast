<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:640px;height:320px;font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#0b1420 0%,#1a2332 100%);color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.glow{position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:300px;height:150px;background:radial-gradient(ellipse,rgba(6,182,212,.15),transparent)}
.content{position:relative;z-index:1;text-align:center}
.icon{font-size:48px;margin-bottom:12px}
h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,#fff,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.tags{display:flex;gap:8px;justify-content:center}
.tag{padding:4px 12px;border-radius:12px;background:rgba(255,255,255,.06);font-size:11px;color:#94a3b8;font-weight:600}
</style></head>
<body>
<div class="glow"></div>
<div class="content">
  <div class="icon">🗜️</div>
  <h1>CompressFast</h1>
  <div class="tags">
    <span class="tag">100% Local</span>
    <span class="tag">AVIF</span>
    <span class="tag">Lifetime $24.99</span>
  </div>
</div>
</body></html>
