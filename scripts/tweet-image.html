<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:800px;background:#0b1420;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;overflow:hidden;position:relative}
.accent{position:absolute;top:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,#06b6d4,#22d3ee)}
.title{position:absolute;top:30px;width:100%;text-align:center;color:#e2e8f0;font-size:28px;font-weight:700;letter-spacing:.3px}
.badges{position:absolute;top:74px;width:100%;display:flex;justify-content:center;gap:216px}
.b-orig{color:#94a3b8;font-size:14px;font-weight:600;background:#1e293b;padding:5px 18px;border-radius:4px}
.b-comp{color:#2dd4bf;font-size:14px;font-weight:600;background:#134e4a;padding:5px 18px;border-radius:4px}
.images{position:absolute;top:112px;left:32px;right:32px;display:flex;gap:16px;justify-content:center}
.img-wrap{flex:1;max-width:560px;border-radius:8px;overflow:hidden;border:1px solid #1e293b}
.img-wrap canvas,.img-wrap img{width:100%;display:block}
.divider{position:absolute;top:112px;left:50%;width:0;height:373px;border-left:2px dashed #1e293b}
.bottom{position:absolute;bottom:0;left:0;right:0;height:102px;display:flex;justify-content:center;align-items:center;gap:0}
.stat{text-align:center;width:260px}
.num-b{font-size:30px;font-weight:700;color:#f87171}
.num-a{font-size:30px;font-weight:700;color:#4ade80}
.lbl{font-size:14px;color:#64748b;margin-top:2px}
.savings{border:2px solid #059669;border-radius:20px;padding:8px 28px;color:#4ade80;font-size:18px;font-weight:700;margin:0 24px;white-space:nowrap}
.brand{position:absolute;bottom:8px;width:100%;text-align:center;color:#475569;font-size:12px}
</style></head><body>
<div class="accent"></div>
<div class="title">Can you spot the difference?</div>
<div class="badges"><span class="b-orig">ORIGINAL</span><span class="b-comp">COMPRESSED</span></div>
<div class="images">
  <div class="img-wrap"><canvas id="leftCanvas"></canvas></div>
  <div class="img-wrap"><canvas id="rightCanvas"></canvas></div>
</div>
<div class="divider"></div>
<div class="bottom">
  <div class="stat"><div class="num-b" id="sizeB">--</div><div class="lbl">Before</div></div>
  <div class="savings" id="sav">--</div>
  <div class="stat"><div class="num-a" id="sizeA">--</div><div class="lbl">After</div></div>
</div>
<div class="brand">compressfast.site — 100% browser-side, zero uploads</div>
<script>
const img = new Image();
img.onload = function() {
  const W = 560, H = Math.round(560 * img.naturalHeight / img.naturalWidth);
  [leftCanvas, rightCanvas].forEach(c => { c.width = W; c.height = H; });
  // Left: original quality
  leftCanvas.getContext('2d').drawImage(img, 0, 0, W, H);
  // Right: compressed quality via re-encode
  const tmp = document.createElement('canvas');
  tmp.width = img.naturalWidth; tmp.height = img.naturalHeight;
  tmp.getContext('2d').drawImage(img, 0, 0);
  tmp.toBlob(function(blob) {
    const img2 = new Image();
    img2.onload = function() {
      rightCanvas.getContext('2d').drawImage(img2, 0, 0, W, H);
      document.getElementById('sizeA').textContent = Math.round(blob.size/1024) + ' KB';
      const srcKB = 1323;
      const cmpKB = Math.round(blob.size/1024);
      const pct = Math.floor((1 - cmpKB / srcKB) * 100);
      document.getElementById('sav').textContent = '{ -' + pct + '% }';
    };
    img2.src = URL.createObjectURL(blob);
  }, 'image/jpeg', 0.25);
  document.getElementById('sizeB').textContent = '1,323 KB';
};
img.src = 'tweet-source.jpg';
</script>
</body></html>
